{%- comment -%}
  Pageview counters.
  Loaded inside <head> via Chirpy's metadata-hook extension point.
{%- endcomment -%}

{%- if site.busuanzi.enabled -%}
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var meta = document.querySelector('article header .post-meta');
      if (!meta) { return; }
      if (document.getElementById('busuanzi_container_page_pv')) { return; }
      var holder = document.createElement('span');
      holder.id = 'busuanzi_container_page_pv';
      holder.className = 'ms-2';
      holder.style.display = 'none';
      holder.innerHTML =
        '<i class="fas fa-eye fa-fw me-1"></i>' +
        '<span id="busuanzi_value_page_pv">--</span> views';
      meta.appendChild(holder);
    });
  </script>
{%- endif -%}

{%- if site.goatcounter.code -%}
  <script
    data-goatcounter="https://{{ site.goatcounter.code }}.goatcounter.com/count"
    async src="//gc.zgo.at/count.js"></script>
{%- endif -%}
